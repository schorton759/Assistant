<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071525" />
  <title>Shared trip · SkyAgent</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #071525; --mist: #e8f1f5; --sunrise: #f4b460;
      --soft: rgba(232,241,245,.78); --faint: rgba(232,241,245,.48); --line: rgba(232,241,245,.2);
    }
    body {
      margin: 0; font-family: "DM Sans", sans-serif; color: var(--mist);
      background: linear-gradient(165deg, #071525 0%, #0b3a4a 48%, #1a6b6b 100%);
      min-height: 100dvh;
    }
    .wrap { width: min(480px, 100%); margin: 0 auto; padding: 28px 22px 48px; }
    .brand { font-family: Fraunces, Georgia, serif; font-size: 2.2rem; margin: 0; }
    .headline { font-family: Fraunces, Georgia, serif; color: var(--sunrise); font-size: 1.35rem; margin: .5rem 0 0; }
    .soft { color: var(--faint); font-size: .9rem; line-height: 1.4; }
    .block { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    .label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
    a.btn {
      display: block; margin-top: .55rem; padding: .8rem 1rem; text-align: center;
      color: var(--navy); background: var(--sunrise); text-decoration: none; font-weight: 700;
    }
    a.btn.secondary { background: transparent; color: var(--sunrise); border: 1px solid rgba(244,180,96,.55); }
    ul { padding-left: 1.1rem; color: var(--soft); }
    .err { color: #ffb4b4; margin-top: 2rem; }
  </style>
</head>
<body>
  <main class="wrap" id="app">
    <p class="soft">Loading shared trip…</p>
  </main>
  <script>
    const money = (n, c='USD') => {
      try { return new Intl.NumberFormat('en-US', { style:'currency', currency:c, maximumFractionDigits:0 }).format(n); }
      catch { return '$'+n; }
    };
    const id = location.pathname.split('/').pop();
    (async () => {
      const el = document.getElementById('app');
      try {
        const res = await fetch('/api/flights/share/' + id);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Not found');
        const t = data.trip;
        const b = t.brief || {};
        const r = t.recommendation || {};
        const links = (r.bookingLinks || t.bookingLinks || []).map(l =>
          `<a class="btn ${l.primary ? '' : 'secondary'}" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`
        ).join('');
        el.innerHTML = `
          <h1 class="brand">SkyAgent</h1>
          <p class="headline">${t.title || (b.origin + ' → ' + b.destination)}</p>
          <p class="soft">${b.departDate || ''}${b.returnDate ? ' → ' + b.returnDate : ''} · ${b.passengerSummary || (b.passengers ? b.passengers + ' travelers' : '')}</p>
          <div class="block">
            <p class="label">Recommended</p>
            <p style="font-size:1.2rem;font-weight:700;margin:.35rem 0">${r.origin || b.origin || ''} → ${r.destination || b.destination || ''}</p>
            <p class="soft">${r.price != null ? money(r.price, r.currency) : ''} · ${r.durationLabel || ''} · ${r.stopsLabel || ''} · ${(r.airlines||[]).join(', ')}</p>
            ${links}
            <a class="btn secondary" href="/api/flights/share/${id}.ics">Add to calendar (.ics)</a>
          </div>
          ${t.preTrip?.tips?.length ? `<div class="block"><p class="label">Pre-trip</p><ul>${t.preTrip.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>` : ''}
          ${t.hotels?.recommendation ? `<div class="block"><p class="label">Hotel</p><p>${t.hotels.recommendation.name} · ${money(t.hotels.recommendation.price)}</p></div>` : ''}
          ${t.cars?.recommendation ? `<div class="block"><p class="label">Car</p><p>${t.cars.recommendation.vendor} · ${t.cars.recommendation.category} · ${money(t.cars.recommendation.price)}</p></div>` : ''}
          ${t.transfers?.recommendation ? `<div class="block"><p class="label">Transfer</p><p>${t.transfers.recommendation.mode} · ${money(t.transfers.recommendation.price)}</p></div>` : ''}
          <div class="block"><a class="btn secondary" href="/skyagent/">Open SkyAgent</a></div>
        `;
      } catch (e) {
        el.innerHTML = `<h1 class="brand">SkyAgent</h1><p class="err">${e.message || 'Trip not found'}</p>`;
      }
    })();
  </script>
</body>
</html>
