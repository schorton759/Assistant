<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#071525" />
  <meta name="description" content="SkyAgent — AI travel desk. Cheapest, shortest, best flights." />
  <title>SkyAgent</title>
  <link rel="manifest" href="/skyagent/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/skyagent/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #071525;
      --deep: #0b3a4a;
      --lagoon: #1a6b6b;
      --mist: #e8f1f5;
      --sunrise: #f4b460;
      --soft: rgba(232, 241, 245, 0.78);
      --faint: rgba(232, 241, 245, 0.48);
      --line: rgba(232, 241, 245, 0.2);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "DM Sans", sans-serif;
      color: var(--mist);
      background: var(--navy);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .sky {
      min-height: 100dvh;
      position: relative;
      background:
        radial-gradient(ellipse 80% 50% at 90% -10%, rgba(244, 180, 96, 0.18), transparent 55%),
        radial-gradient(ellipse 60% 45% at -10% 90%, rgba(120, 210, 200, 0.16), transparent 50%),
        linear-gradient(165deg, #071525 0%, #0b3a4a 48%, #1a6b6b 100%);
    }

    .wrap {
      width: min(480px, 100%);
      margin: 0 auto;
      padding: calc(20px + var(--safe-top)) 22px calc(40px + var(--safe-bottom));
    }

    .hero {
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.75s ease forwards;
    }

    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.75rem, 12vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin: 0;
    }

    .headline {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 1.4rem;
      color: var(--sunrise);
      margin: 0.55rem 0 0;
    }

    .subhead {
      margin: 0.7rem 0 0;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--soft);
      max-width: 22rem;
    }

    .ask {
      margin-top: 1.75rem;
      opacity: 0;
      animation: rise 0.75s ease 0.12s forwards;
    }

    textarea, input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--mist);
      font: inherit;
      outline: none;
      border-radius: 0;
      -webkit-appearance: none;
    }

    .codes,
    .dates,
    .date-field,
    .arrow { display: none; }

    textarea {
      min-height: 7rem;
      resize: none;
      font-size: 1.15rem;
      line-height: 1.5;
      padding: 0.75rem 0;
    }

    textarea::placeholder, input::placeholder {
      color: rgba(232, 241, 245, 0.4);
    }

    .codes {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.65rem;
      align-items: end;
      margin-top: 1.1rem;
    }

    .codes input {
      text-align: center;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.2em;
      padding: 0.55rem 0;
      text-transform: uppercase;
    }

    .arrow {
      font-family: "Fraunces", Georgia, serif;
      color: var(--sunrise);
      font-size: 1.35rem;
      padding-bottom: 0.45rem;
    }

    .dates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-top: 1.15rem;
    }

    .date-field label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 0.35rem;
    }

    .date-field input[type="date"] {
      color-scheme: dark;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.55rem 0;
      min-height: 2.5rem;
    }

    .date-field input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.85) sepia(0.4) saturate(2) hue-rotate(5deg);
      cursor: pointer;
      opacity: 0.85;
    }

    .cta {
      margin-top: 1.35rem;
      width: 100%;
      border: none;
      background: var(--sunrise);
      color: #0b1f33;
      font-family: "DM Sans", sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 1rem 1.2rem;
      cursor: pointer;
      animation: pulse 2.4s ease-in-out infinite;
    }

    .cta:disabled {
      opacity: 0.7;
      animation: none;
    }

    .prompts {
      display: flex;
      gap: 0.55rem;
      overflow-x: auto;
      margin-top: 1rem;
      padding-bottom: 0.25rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .prompts::-webkit-scrollbar { display: none; }

    .prompt {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--soft);
      font: 500 0.8rem/1.2 "DM Sans", sans-serif;
      padding: 0.55rem 0.75rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .status {
      margin-top: 1rem;
      min-height: 1.25rem;
      font-size: 0.9rem;
      color: #ffb4a8;
    }

    .results {
      margin-top: 1.8rem;
      opacity: 0;
      transform: translateY(10px);
    }
    .results.show {
      animation: rise 0.45s ease forwards;
    }

    .label {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 0 0 0.5rem;
    }

    .concierge-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.55rem;
      line-height: 1.2;
      margin: 0 0 0.55rem;
    }

    .concierge-body {
      margin: 0 0 1rem;
      color: var(--soft);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin: 1.25rem 0 0.4rem;
    }

    .tab {
      border: none;
      background: transparent;
      color: var(--faint);
      font: 500 0.95rem/1 "DM Sans", sans-serif;
      padding: 0.7rem 0.2rem;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .tab.active {
      color: var(--mist);
      border-bottom-color: var(--sunrise);
    }

    .offer {
      padding: 0.95rem 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      text-align: left;
      width: 100%;
      background: transparent;
      color: inherit;
      font: inherit;
      display: block;
    }
    .offer.featured {
      background: rgba(244, 180, 96, 0.08);
      margin: 0 -0.55rem;
      padding-left: 0.55rem;
      padding-right: 0.55rem;
      width: calc(100% + 1.1rem);
    }
    .offer:active { opacity: 0.9; }

    .offer-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: baseline;
    }

    .route {
      font-weight: 700;
      font-size: 1rem;
    }

    .price {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.35rem;
      color: var(--sunrise);
      white-space: nowrap;
    }

    .meta, .soft {
      margin-top: 0.25rem;
      font-size: 0.9rem;
      color: var(--soft);
    }
    .soft { color: var(--faint); font-size: 0.8rem; }
    .stops-emph { color: var(--sunrise); font-weight: 500; }

    .clarify {
      margin-top: 1.2rem;
      padding-top: 0.4rem;
    }
    .clarify-q {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.35rem;
      margin: 0 0 0.85rem;
      line-height: 1.25;
    }
    .clarify-opts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }
    .clarify-opts button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--mist);
      font: 700 1rem/1 "DM Sans", sans-serif;
      padding: 0.75rem 1rem;
      min-width: 3rem;
      cursor: pointer;
    }

    .age-list {
      display: grid;
      gap: 0.75rem;
      margin: 0.85rem 0 1rem;
    }
    .age-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: end;
    }
    .age-row label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 0.3rem;
    }
    .age-row input {
      width: 5.5rem;
      text-align: center;
      font-weight: 700;
      font-size: 1.15rem;
      padding: 0.55rem 0;
    }
    .age-hint {
      font-size: 0.8rem;
      color: var(--faint);
      margin: 0 0 0.85rem;
      line-height: 1.4;
    }

    .family-chip {
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: var(--faint);
    }
    .family-chip button {
      border: none;
      background: none;
      color: var(--sunrise);
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
    }
    .sheet.open { display: block; }
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 12, 20, 0.72);
    }
    .sheet-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: min(88dvh, 720px);
      overflow: auto;
      background: linear-gradient(180deg, #0c2a38 0%, #071525 100%);
      border-top: 1px solid var(--line);
      padding: 1.1rem 1.25rem calc(1.4rem + var(--safe-bottom));
      animation: sheetUp 0.28s ease;
    }
    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: rgba(232,241,245,0.28);
      margin: 0 auto 0.9rem;
    }
    .sheet-close {
      float: right;
      border: none;
      background: transparent;
      color: var(--faint);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .leg {
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(232,241,245,0.12);
    }
    .leg-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      font-weight: 700;
    }
    .layover {
      margin: 0.35rem 0 0.15rem;
      font-size: 0.8rem;
      color: var(--sunrise);
    }

    .agents { margin-top: 1.4rem; }
    .agent {
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(232, 241, 245, 0.12);
    }
    .agent strong { font-size: 0.9rem; }
    .agent span {
      color: var(--faint);
      font-weight: 400;
    }
    .agent p {
      margin: 0.35rem 0 0;
      color: var(--soft);
      font-size: 0.85rem;
      line-height: 1.45;
    }

    .footnote {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      color: var(--faint);
    }

    .install {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--faint);
      line-height: 1.45;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
    @keyframes sheetUp {
      from { transform: translateY(24px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero, .ask, .results, .cta, .sheet-panel { animation: none !important; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="sky">
    <main class="wrap">
      <header class="hero">
        <h1 class="brand">SkyAgent</h1>
        <p class="headline">Your AI travel desk</p>
        <p class="subhead">Say where, when, and what matters — cheapest, fastest, or best.</p>
      </header>

      <section class="ask">
        <label class="label" for="query">Ask</label>
        <textarea id="query" placeholder="Family trip Bermuda to London August 16…">Best flight from Bermuda to London for my family on August 16</textarea>

        <button class="cta" id="searchBtn" type="button">Ask the agents</button>

        <div class="prompts" id="prompts">
          <button class="prompt" type="button" data-q="Best flight from Bermuda to London for my family on August 16">Family · Bermuda → London</button>
          <button class="prompt" type="button" data-q="Cheapest JFK to LHR leaving September 12, back September 20">Cheapest JFK → London</button>
          <button class="prompt" type="button" data-q="Fastest SFO to Tokyo next month, two of us">Fastest SFO → Tokyo for 2</button>
        </div>

        <p class="family-chip" id="familyChip" hidden></p>
        <p class="status" id="status" aria-live="polite"></p>
      </section>

      <section class="results" id="results" hidden></section>

      <p class="install">
        On iPhone: tap Share → <strong>Add to Home Screen</strong> for the full-screen app feel.
      </p>
    </main>
  </div>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <button type="button" class="sheet-close" id="sheetClose">Close</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script>
    const FAMILY_KEY = 'skyagent.familyProfile';

    const money = (n, c = 'USD') => {
      try {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: c,
          maximumFractionDigits: 0,
        }).format(n);
      } catch {
        return `$${n}`;
      }
    };

    function loadFamily() {
      try {
        const raw = JSON.parse(localStorage.getItem(FAMILY_KEY) || 'null');
        if (raw && Number(raw.size) > 0 && Array.isArray(raw.ages) && raw.ages.length === Number(raw.size)) {
          return { size: Number(raw.size), ages: raw.ages.map(Number) };
        }
      } catch {
        /* ignore */
      }
      return { size: null, ages: null };
    }

    const els = {
      query: document.getElementById('query'),
      btn: document.getElementById('searchBtn'),
      status: document.getElementById('status'),
      results: document.getElementById('results'),
      familyChip: document.getElementById('familyChip'),
      sheet: document.getElementById('sheet'),
      sheetBody: document.getElementById('sheetBody'),
      sheetClose: document.getElementById('sheetClose'),
      sheetBackdrop: document.getElementById('sheetBackdrop'),
    };

    const savedFamily = loadFamily();
    let state = {
      result: null,
      bucket: 'best',
      pendingQuery: null,
      familySize: savedFamily.size,
      familyAges: savedFamily.ages,
    };

    function rememberFamily(size, ages) {
      state.familySize = Number(size);
      state.familyAges = ages.map(Number);
      localStorage.setItem(FAMILY_KEY, JSON.stringify({ size: state.familySize, ages: state.familyAges }));
      renderFamilyChip();
    }

    function clearFamily() {
      state.familySize = null;
      state.familyAges = null;
      localStorage.removeItem(FAMILY_KEY);
      renderFamilyChip();
    }

    function ageBand(age) {
      if (age < 2) return 'infant';
      if (age < 12) return 'child';
      return 'adult';
    }

    function renderFamilyChip() {
      if (!state.familySize || !state.familyAges?.length) {
        els.familyChip.hidden = true;
        els.familyChip.innerHTML = '';
        return;
      }
      const summary = state.familyAges.map((a) => `${a}y`).join(', ');
      els.familyChip.hidden = false;
      els.familyChip.innerHTML = `Remembered family: <strong>${state.familySize}</strong> (${summary}) · <button type="button" id="clearFamily">clear</button>`;
      document.getElementById('clearFamily')?.addEventListener('click', clearFamily);
    }

    function formatTripDate(iso) {
      if (!iso) return '';
      try {
        return new Date(`${iso}T12:00:00`).toLocaleDateString('en-US', {
          weekday: 'short', month: 'short', day: 'numeric',
        });
      } catch {
        return iso;
      }
    }

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString('en-US', {
          hour: 'numeric', minute: '2-digit', timeZone: 'UTC',
        }) + ' UTC';
      } catch {
        return iso;
      }
    }

    function offerById(id) {
      const data = state.result;
      if (!data) return null;
      if (data.recommendation?.id === id) return data.recommendation;
      for (const key of ['cheapest', 'shortest', 'best']) {
        const hit = (data.buckets?.[key] || []).find((o) => o.id === id);
        if (hit) return hit;
      }
      return null;
    }

    function offerHtml(offer, featured) {
      const tripDates = offer.returnDate
        ? `${formatTripDate(offer.departDate)} → ${formatTripDate(offer.returnDate)}`
        : formatTripDate(offer.departDate);
      const paxBits = [];
      if (offer.passengers > 1) paxBits.push(`total for ${offer.passengers}`);
      if (offer.passengerSummary) {
        const parts = [];
        if (offer.passengerSummary.adult) parts.push(`${offer.passengerSummary.adult} adult${offer.passengerSummary.adult > 1 ? 's' : ''}`);
        if (offer.passengerSummary.child) parts.push(`${offer.passengerSummary.child} child${offer.passengerSummary.child > 1 ? 'ren' : ''}`);
        if (offer.passengerSummary.infant) parts.push(`${offer.passengerSummary.infant} infant${offer.passengerSummary.infant > 1 ? 's' : ''}`);
        if (parts.length) paxBits.push(parts.join(', '));
      }
      const pax = paxBits.length ? ` · ${paxBits.join(' · ')}` : '';
      return `
        <button type="button" class="offer ${featured ? 'featured' : ''}" data-offer-id="${offer.id}">
          <div class="offer-top">
            <div class="route">${offer.origin} → ${offer.destination}</div>
            <div class="price">${money(offer.price, offer.currency)}</div>
          </div>
          <div class="meta">${tripDates ? tripDates + ' · ' : ''}${offer.durationLabel} · <span class="stops-emph">${offer.stopsLabel}</span> · ${offer.airlines.join(', ')}</div>
          <div class="soft">Comfort ${offer.comfortScore}${offer.baggageIncluded ? ' · bags included' : ' · bags extra'}${pax} · tap for details</div>
        </button>
      `;
    }

    function openDetails(offer) {
      if (!offer) return;
      const legs = (offer.segments || []).map((seg, i) => `
        ${seg.layoverLabel ? `<div class="layover">Layover in ${seg.origin} · ${seg.layoverLabel}</div>` : ''}
        <div class="leg">
          <div class="leg-top">
            <span>${seg.origin} → ${seg.destination}</span>
            <span>${seg.durationLabel}</span>
          </div>
          <div class="meta">${seg.airlineName} ${seg.flightNumber}</div>
          <div class="soft">${formatTime(seg.departAt)} → ${formatTime(seg.arriveAt)}</div>
        </div>
      `).join('');

      els.sheetBody.innerHTML = `
        <p class="label">Flight details</p>
        <h2 class="concierge-title" id="sheetTitle">${offer.origin} → ${offer.destination}</h2>
        <p class="concierge-body">
          ${money(offer.price, offer.currency)}${offer.passengers > 1 ? ` total for ${offer.passengers}` : ''}
          · ${offer.durationLabel} · <span class="stops-emph">${offer.stopsLabel}</span>
        </p>
        ${legs}
        <p class="footnote">${offer.baggageIncluded ? 'Bags included' : 'Bags may be extra'} · Comfort ${offer.comfortScore}${offer.refundable ? ' · refundable' : ''}</p>
      `;
      els.sheet.classList.add('open');
      els.sheet.setAttribute('aria-hidden', 'false');
    }

    function closeDetails() {
      els.sheet.classList.remove('open');
      els.sheet.setAttribute('aria-hidden', 'true');
    }

    function renderAgeForm({ passengerCount, pendingQuery, question, hints }) {
      const count = Number(passengerCount) || state.familySize || 2;
      const prior = state.familyAges?.length === count ? state.familyAges : [];
      els.results.hidden = false;
      els.results.classList.add('show');
      els.results.innerHTML = `
        <div class="clarify">
          <p class="label">Quick question</p>
          <p class="clarify-q">${question || `What are the ages of the ${count} travelers?`}</p>
          <p class="age-hint">${(hints || ['Adult: 12+', 'Child: 2–11', 'Infant: under 2']).join(' · ')}</p>
          <form id="ageForm" class="age-list">
            ${Array.from({ length: count }, (_, i) => `
              <div class="age-row">
                <div>
                  <label for="age-${i}">Traveler ${i + 1}</label>
                  <div class="soft" id="band-${i}">${prior[i] != null ? ageBand(prior[i]) : 'enter age'}</div>
                </div>
                <input id="age-${i}" name="age" type="number" inputmode="numeric" min="0" max="119" required
                  value="${prior[i] != null ? prior[i] : ''}" placeholder="age" />
              </div>
            `).join('')}
            <button class="cta" type="submit">Save ages & search</button>
          </form>
        </div>
      `;

      els.results.querySelectorAll('input[name="age"]').forEach((input, i) => {
        input.addEventListener('input', () => {
          const band = document.getElementById(`band-${i}`);
          const val = Number(input.value);
          band.textContent = Number.isFinite(val) && input.value !== '' ? ageBand(val) : 'enter age';
        });
      });

      document.getElementById('ageForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const ages = [...els.results.querySelectorAll('input[name="age"]')].map((el) => Number(el.value));
        if (ages.some((a) => !Number.isFinite(a) || a < 0 || a > 119)) {
          els.status.textContent = 'Enter a valid age for each traveler.';
          return;
        }
        rememberFamily(count, ages);
        search({
          query: pendingQuery || els.query.value,
          passengers: count,
          ages,
        });
      });
    }

    function renderClarification(data) {
      const type = data.clarification?.type;
      if (type === 'passenger_ages') {
        renderAgeForm({
          passengerCount: data.clarification.passengerCount || data.brief?.passengers,
          pendingQuery: data.pendingQuery,
          question: data.clarification.question,
          hints: data.clarification.hints,
        });
        return;
      }

      const q = data.clarification?.question || 'How many people are flying?';
      const opts = data.clarification?.options || [2, 3, 4, 5, 6];
      els.results.hidden = false;
      els.results.classList.add('show');
      els.results.innerHTML = `
        <div class="clarify">
          <p class="label">Quick question</p>
          <p class="clarify-q">${q}</p>
          <div class="clarify-opts">
            ${opts.map((n) => `<button type="button" data-pax="${n}">${n}</button>`).join('')}
          </div>
        </div>
      `;
      els.results.querySelectorAll('[data-pax]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const n = Number(btn.dataset.pax);
          state.familySize = n;
          // Next: collect ages before searching
          renderAgeForm({
            passengerCount: n,
            pendingQuery: data.pendingQuery || els.query.value,
            question: `What are the ages of the ${n} travelers?`,
          });
        });
      });
    }

    function render() {
      const data = state.result;
      if (!data) return;

      if (data.status === 'needs_clarification') {
        renderClarification(data);
        return;
      }

      const concierge = data.agents.find((a) => a.agent === 'Concierge') || {};
      const offers = data.buckets[state.bucket] || [];
      const recId = data.recommendation?.id;
      const understood = [
        data.brief?.origin && data.brief?.destination
          ? `${data.brief.origin} → ${data.brief.destination}`
          : null,
        data.brief?.returnDate
          ? `${formatTripDate(data.brief.departDate)} → ${formatTripDate(data.brief.returnDate)}`
          : formatTripDate(data.brief?.departDate),
        data.brief?.passengerSummary || (data.brief?.passengers > 1 ? `${data.brief.passengers} travelers` : null),
      ].filter(Boolean).join(' · ');

      els.results.hidden = false;
      els.results.classList.remove('show');
      void els.results.offsetWidth;
      els.results.classList.add('show');

      els.results.innerHTML = `
        <p class="label">Understood${understood ? ` · ${understood}` : ''}</p>
        <h2 class="concierge-title">${concierge.headline || 'Your AI travel desk recommends'}</h2>
        <p class="concierge-body">${concierge.summary || ''}</p>
        ${data.recommendation ? offerHtml(data.recommendation, true) : ''}

        <div class="tabs">
          ${['cheapest', 'shortest', 'best'].map((key) => `
            <button class="tab ${state.bucket === key ? 'active' : ''}" data-bucket="${key}" type="button">
              ${key[0].toUpperCase()}${key.slice(1)}
            </button>
          `).join('')}
        </div>

        ${offers.map((o) => offerHtml(o, o.id === recId)).join('')}

        <div class="agents">
          <p class="label">Agent desk</p>
          ${data.agents.map((a) => `
            <div class="agent">
              <strong>${a.agent}<span> · ${a.model}</span></strong>
              <p>${a.reasoning || a.summary || ''}</p>
            </div>
          `).join('')}
        </div>

        <p class="footnote">
          ${data.nvidiaEnabled
            ? 'Powered by free NVIDIA NIM models.'
            : 'Running on local ranking. Add NVIDIA_API_KEY for live NIM agents.'}
        </p>
      `;

      els.results.querySelectorAll('[data-bucket]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.bucket = btn.dataset.bucket;
          render();
        });
      });

      els.results.querySelectorAll('[data-offer-id]').forEach((btn) => {
        btn.addEventListener('click', () => openDetails(offerById(btn.dataset.offerId)));
      });
    }

    async function search(override = {}) {
      const query = (override.query ?? els.query.value).trim();
      if (!query) {
        els.status.textContent = 'Tell me where and when you want to fly.';
        return;
      }

      if (override.query) els.query.value = override.query;
      state.pendingQuery = query;

      const passengers = override.passengers || state.familySize || undefined;
      const ages = override.ages || state.familyAges || undefined;

      els.status.textContent = '';
      els.btn.disabled = true;
      els.btn.textContent = 'Agents working…';

      try {
        const body = { query, message: query };
        if (passengers) body.passengers = passengers;
        if (ages?.length) body.ages = ages;

        const res = await fetch('/api/flights/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Search failed');

        state.result = data;
        if (['cheapest', 'shortest', 'best'].includes(data.brief?.preference)) {
          state.bucket = data.brief.preference;
        }
        render();
      } catch (err) {
        els.status.textContent = err.message || 'Search failed';
      } finally {
        els.btn.disabled = false;
        els.btn.textContent = 'Ask the agents';
      }
    }

    els.btn.addEventListener('click', () => search());
    document.getElementById('prompts').addEventListener('click', (e) => {
      const btn = e.target.closest('.prompt');
      if (!btn) return;
      search({ query: btn.dataset.q });
    });
    els.sheetClose.addEventListener('click', closeDetails);
    els.sheetBackdrop.addEventListener('click', closeDetails);
    renderFamilyChip();
  </script>
</body>
</html>
